# Independent monitoring project. Never merge with compose.server.yaml.
name: taskflow-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=512MB
      - --query.max-concurrency=4
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring, taskflow_edge]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_SECURITY_ADMIN_USER: taskflow-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_SMTP_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    secrets: [grafana_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3001:3000']
    networks: [monitoring, ingress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 32
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
networks:
  monitoring: {internal: true}
  ingress: {}
  taskflow_edge:
    external: true
    name: ${TASKFLOW_EDGE_NETWORK:-taskflow-server_edge}
volumes:
  prometheus_data:
  grafana_data:
secrets:
  grafana_password:
    file: ./.local/monitoring/grafana_password
