name: Reliability tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install migration CLI
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
      - name: Check sqlc generation consistency
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- internal/db/sqlc
          test -z "$(git ls-files --others --exclude-standard -- internal/db/sqlc)"
      - name: Discord command registration safety
        run: python3 -m unittest discover -s test/python -p "test_register_discord_commands.py" -v
      - name: CD safety regression tests
        run: |
          python3 -m unittest discover -s test/python -p "test_deploy_release.py" -v
          python3 -m unittest discover -s test/python -p "test_prepare_monitoring.py" -v
      - name: Unit tests and static checks
        run: |
          test -z "$(gofmt -l cmd internal test)"
          go vet ./cmd/... ./internal/... ./test/...
          go test ./cmd/... ./internal/... ./test/...
      - name: Go dependency vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./internal/... ./cmd/...
      - name: Three isolated database rounds with race detector
        run: python3 scripts/test_integration.py --repeat 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: artifacts/lesson21/
          if-no-files-found: ignore

  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare browser and frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Install migration CLI
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
      - name: Browser through real API and isolated Discord stub
        run: python3 scripts/test_integration.py --repeat 1 --browser-e2e

  frontend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run api:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable local test credentials and certificates
        run: python3 scripts/init_local_stack.py
      - name: Build pinned multi-stage images
        run: docker compose -f compose.production.yaml build --pull
      - name: Verify migration gate and persistent container stack
        run: python3 -m test.python.test_local_stack
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pull pinned monitoring images and check rules
        run: |
          docker compose -f compose.monitoring.yaml pull
          python3 scripts/check_monitoring_rules.py
      - name: Monitoring and isolated deployment failure drills
        run: |
          python3 -m test.python.test_monitoring
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-image-sizes
          path: artifacts/lesson23/images.json
          if-no-files-found: ignore
