name: Reliability tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install migration CLI
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
      - name: CD safety regression tests
        run: python3 -m unittest discover -s scripts -p "test_deploy_release.py" -v
      - name: Unit tests and static checks
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./cmd/... ./internal/...
          go test ./cmd/... ./internal/...
      - name: Go dependency vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./internal/... ./cmd/...
      - name: Three isolated database rounds with race detector
        run: python3 scripts/test_integration.py --repeat 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: artifacts/lesson21/
          if-no-files-found: ignore

  frontend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run api:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable local test credentials and certificates
        run: python3 scripts/init_local_stack.py
      - name: Build pinned multi-stage images
        run: docker compose -f compose.production.yaml build --pull
      - name: Verify migration gate and persistent container stack
        run: python3 scripts/test_local_stack.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-image-sizes
          path: artifacts/lesson23/images.json
          if-no-files-found: ignore
