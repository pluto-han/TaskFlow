
version: "2"

sql:
  - engine: "postgresql"

    queries: "internal/db/queries"

    schema: "migrations"

    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true

        overrides:
          - column: "tasks.created_at"
            go_type: "time.Time"