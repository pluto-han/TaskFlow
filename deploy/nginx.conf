worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 5s;
  keepalive_timeout 60s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:1m rate=5r/s;
  limit_req_status 429;
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/secrets/web_cert;
    ssl_certificate_key /run/secrets/web_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    location = /_health { access_log off; return 200 'ok'; }
    location ~ ^/api/auth/(login|register|browser/login)$ {
      limit_req zone=auth burst=10 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api:9090;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }
    location /api/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://api:9090/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
