groups:
  - name: taskflow
    rules:
      - alert: TaskFlowSchedulerStopped
        expr: taskflow_recurrence_scheduler_enabled{job="taskflow"} == 1 and on(job, instance) (time() - taskflow_recurrence_last_success_timestamp_seconds{job="taskflow"} > 600)
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Enabled recurrence scheduler has not completed a scan for ten minutes
      - alert: TaskFlowNotificationWorkerStopped
        expr: taskflow_notification_sender_enabled{job="taskflow"} == 1 and on(job, instance) (time() - taskflow_notification_last_success_timestamp_seconds{job="taskflow"} > 180)
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Enabled notification sender has not completed a poll for three minutes
      - alert: TaskFlowNotificationBacklog
        expr: taskflow_notification_sender_enabled{job="taskflow"} == 1 and on(job, instance) (taskflow_notification_ready_events{job="taskflow"} > 0) and on(job, instance) (taskflow_notification_oldest_ready_age_seconds{job="taskflow"} > 300)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Eligible notifications have been waiting for more than five minutes
      - alert: TaskFlowNotificationSendFailure
        expr: (sum by (job, instance) (increase(taskflow_notification_send_total{job="taskflow",outcome=~"rejected|server_error|network_error"}[10m])) > 0) and on(job, instance) (taskflow_notification_sender_enabled{job="taskflow"} == 1)
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: Discord notification attempts have failed in the last ten minutes
      - alert: TaskFlowUnavailable
        expr: up{job="taskflow"} == 0 or absent(up{job="taskflow"})
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: TaskFlow metrics endpoint has been unavailable for two minutes
      - alert: TaskFlowDatabaseUnavailable
        expr: taskflow_database_ready{job="taskflow"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: TaskFlow database readiness probe is failing
      - alert: TaskFlowHighErrorRate
        expr: |
          ((sum(rate(taskflow_http_requests_total{job="taskflow",status_class="5xx",route!~"/health.*"}[5m])) or vector(0))
          / clamp_min(sum(rate(taskflow_http_requests_total{job="taskflow",route!~"/health.*"}[5m])), 0.000001) > 0.05)
          and (sum(increase(taskflow_http_requests_total{job="taskflow",route!~"/health.*"}[5m])) >= 20)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: More than 5 percent server errors with at least 20 requests in five minutes
      - alert: TaskFlowHighLatency
        expr: |
          (histogram_quantile(0.95, sum by (le) (rate(taskflow_http_request_duration_seconds_bucket{job="taskflow",route!~"/health.*"}[5m]))) > 1)
          and (sum(increase(taskflow_http_request_duration_seconds_count{job="taskflow",route!~"/health.*"}[5m])) >= 20)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: API p95 exceeds one second with at least 20 requests in five minutes
      - alert: TaskFlowDiskLow
        expr: node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Host root filesystem has less than 15 percent available space
      - alert: TaskFlowHostMetricsMissing
        expr: up{job="node"} == 0 or absent(node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"})
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Host disk monitoring is unavailable
